name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/gonzales:latest

    steps:
      - uses: actions/checkout@v6

      - name: Fix permissions
        run: |
          chown -R builder:builder .

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Test
        run: |
          uv sync
          make test_release

      # `make test_release` only renders a scene -- it never ran the unit
      # tests, so CI was green while four test files did not even COMPILE
      # (a struct gained fields and three call sites were missed) and seven
      # more failed intermittently. Both were invisible until this step
      # existed.
      - name: Unit tests
        run: |
          make unittest

      # Scenes whose radiance is known in closed form, compared against it.
      # Every other render check in this repo compares the renderer against
      # something the renderer produced -- a pinned value, a converged
      # reference -- so all of them detect drift and none can say the output
      # is WRONG. This one can: the closed cavity must read exactly 1.0, and
      # the smoke matrix was happily pinning VCM's 0.63 there as "expected".
      # Self-skips without a CUDA toolkit, since render tests are GPU-only.
      - name: Analytic scenes
        run: |
          make analytictest
